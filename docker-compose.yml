# Generic Dana customer instance compose file.
# Per customer: copy install_config.example.py → install_config.py (PRODUCT_MODE),
# fill .env with secrets/hosts/DATABASE_URL, adjust ports/volumes.
# Product identity is NOT read from .env.

name: dana-customer

services:
  web:
    image: dana:latest
    build:
      context: .
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      # Prefer DATABASE_URL from .env; container default only if unset there:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/db.sqlite3}
      STATIC_ROOT: ${STATIC_ROOT:-/app/staticfiles}
      MEDIA_ROOT: ${MEDIA_ROOT:-/app/media}
    volumes:
      - dana_data:/data
      - ./media:/app/media
      # install_config.py must be present in the build context / image working dir
      # (or mount it explicitly). Do not put PRODUCT_MODE in .env.
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    healthcheck:
      # Host header must match an entry in ALLOWED_HOSTS (include localhost for this check)
      test: ["CMD", "curl", "-f", "-H", "Host: localhost", "http://127.0.0.1:8000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  dana_data:
