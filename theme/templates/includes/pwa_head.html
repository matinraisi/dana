{% load static %}
<link rel="manifest" href="{% url 'pwa_manifest' %}">
<meta name="theme-color" content="{{ school_color|default:installation.primary_color|default:'#4f46e5' }}">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="{{ school_title|default:installation.organization_name|default:'دانا' }}">
{% if school_favicon %}
<link rel="apple-touch-icon" href="{{ school_favicon }}">
<link rel="icon" href="{{ school_favicon }}">
{% else %}
<link rel="apple-touch-icon" href="{% static 'pwa/icon-192.png' %}">
{% endif %}
<style>
  :root {
    --brand-primary: {{ school_color|default:installation.primary_color|default:'#4f46e5' }};
    --brand-secondary: {{ installation.secondary_color|default:'#06b6d4' }};
  }
</style>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('{% static "pwa/sw.js" %}').catch(function () {});
    });
  }
</script>
