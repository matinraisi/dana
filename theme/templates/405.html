{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="fa" dir="rtl" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ school_title }} | متد نامعتبر</title>
    {% tailwind_css %}
    <style>
        @font-face { font-family:'Vazirmatn'; src:url("{% static 'fonts/Vazirmatn-Regular.woff2' %}") format('woff2'); font-weight:400; }
        @font-face { font-family:'Vazirmatn'; src:url("{% static 'fonts/Vazirmatn-Black.woff2' %}") format('woff2'); font-weight:900; }
        body { font-family:'Vazirmatn', sans-serif; }
    </style>
</head>
<body class="bg-[#020617] text-slate-200 antialiased min-h-screen flex items-center justify-center p-6">
    <div class="text-center max-w-md">
        <div class="w-24 h-24 mx-auto mb-8 rounded-full bg-purple-500/10 flex items-center justify-center">
            <svg class="w-12 h-12 text-purple-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z"/>
            </svg>
        </div>
        <h1 class="text-7xl font-black text-white mb-2">۴۰۵</h1>
        <p class="text-lg font-bold text-slate-300 mb-6">متد درخواست مجاز نیست</p>
        <p class="text-sm text-slate-500 leading-relaxed mb-8">
            نوع درخواست ارسالی برای این آدرس معتبر نیست.<br>
            لطفاً از طریق لینک‌های موجود در سایت اقدام کنید.
        </p>
        <div class="flex gap-3 justify-center">
            <a href="/" class="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl bg-blue-600 text-white text-sm font-bold hover:bg-blue-500 transition">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                بازگشت به صفحه اصلی
            </a>
            <button onclick="history.back()" class="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl border border-slate-700 text-slate-300 text-sm font-bold hover:bg-slate-800 transition">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12h18M3 12l4-4m-4 4l4 4"/></svg>
                صفحه قبل
            </a>
        </div>
    </div>
</body>
</html>
