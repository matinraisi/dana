{% load static tailwind_tags %}
<!doctype html>
<html lang="fa" dir="rtl" class="h-full scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>فرم یافت نشد</title>
  {% tailwind_css %}
  <style>
    @font-face { font-family:"Vazirmatn"; src:url("{% static 'font/fonts/webfonts/Vazirmatn-Regular.woff2' %}") format("woff2"); font-weight:400; }
    @font-face { font-family:"Vazirmatn"; src:url("{% static 'font/fonts/webfonts/Vazirmatn-Black.woff2' %}") format("woff2"); font-weight:900; }
    body { font-family:"Vazirmatn",sans-serif; }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-50 via-white to-slate-100 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md text-center">
    <div class="bg-white rounded-3xl shadow-xl border border-slate-100 p-10 space-y-6">
      <div class="w-20 h-20 mx-auto rounded-full bg-amber-100 flex items-center justify-center">
        <svg class="w-10 h-10 text-amber-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      </div>
      <div class="space-y-2">
        <h1 class="text-xl font-black text-slate-800">فرم مورد نظر یافت نشد</h1>
        <p class="text-sm text-slate-500 leading-relaxed">
          فرمی با شناسه «{{ slug }}» در سیستم وجود ندارد یا غیرفعال شده است.
        </p>
      </div>
      <a href="/" class="inline-flex items-center gap-2 px-8 py-3 bg-slate-600 hover:bg-slate-700 text-white font-bold rounded-xl transition text-sm">
        بازگشت به صفحه اصلی
      </a>
    </div>
  </div>
</body>
</html>
