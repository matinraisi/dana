{% load custom_filters %}
<div class="grid grid-cols-2 lg:grid-cols-3 xl:grid-cols-6 gap-3 mb-6">
  <div class="bg-white border border-slate-200 rounded-xl p-4">
    <div class="flex items-center justify-between mb-2">
      <span class="text-[10px] font-bold text-slate-400">هنرجویان</span>
      <div class="w-8 h-8 bg-indigo-50 rounded-lg flex items-center justify-center">
        <svg class="w-4 h-4 text-indigo-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125 4.125 0 00-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 018.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0111.964-3.07M12 6.375a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zm8.25 2.25a2.625 2.625 0 11-5.25 0 2.625 2.625 0 015.25 0z"/></svg>
      </div>
    </div>
    <p class="text-xl font-black text-slate-800">{{ total_students|toman }}</p>
    <p class="text-[10px] text-slate-400 mt-1">نفر</p>
  </div>

  <div class="bg-white border border-slate-200 rounded-xl p-4">
    <div class="flex items-center justify-between mb-2">
      <span class="text-[10px] font-bold text-slate-400">دوره‌ها</span>
      <div class="w-8 h-8 bg-blue-50 rounded-lg flex items-center justify-center">
        <svg class="w-4 h-4 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
      </div>
    </div>
    <p class="text-xl font-black text-slate-800">{{ total_courses|toman }}</p>
    <p class="text-[10px] text-slate-400 mt-1">دوره</p>
  </div>

  <div class="bg-white border border-slate-200 rounded-xl p-4">
    <div class="flex items-center justify-between mb-2">
      <span class="text-[10px] font-bold text-slate-400">ثبت‌نام‌ها</span>
      <div class="w-8 h-8 bg-emerald-50 rounded-lg flex items-center justify-center">
        <svg class="w-4 h-4 text-emerald-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
      </div>
    </div>
    <p class="text-xl font-black text-slate-800">{{ total_enrollments|toman }}</p>
    <p class="text-[10px] text-slate-400 mt-1">مورد</p>
  </div>

  <div class="bg-white border border-slate-200 rounded-xl p-4">
    <div class="flex items-center justify-between mb-2">
      <span class="text-[10px] font-bold text-slate-400">درآمد</span>
      <div class="w-8 h-8 bg-emerald-50 rounded-lg flex items-center justify-center">
        <svg class="w-4 h-4 text-emerald-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      </div>
    </div>
    <p class="text-xl font-black text-emerald-600">{{ total_revenue|toman }}</p>
    <p class="text-[10px] text-slate-400 mt-1">تومان</p>
  </div>

  <div class="bg-white border border-slate-200 rounded-xl p-4">
    <div class="flex items-center justify-between mb-2">
      <span class="text-[10px] font-bold text-slate-400">بدهی معوق</span>
      <div class="w-8 h-8 bg-rose-50 rounded-lg flex items-center justify-center">
        <svg class="w-4 h-4 text-rose-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z"/></svg>
      </div>
    </div>
    <p class="text-xl font-black text-rose-600">{{ total_outstanding|toman }}</p>
    <p class="text-[10px] text-slate-400 mt-1">تومان</p>
  </div>

  <div class="bg-white border border-slate-200 rounded-xl p-4">
    <div class="flex items-center justify-between mb-2">
      <span class="text-[10px] font-bold text-slate-400">حضور ثبت شده</span>
      <div class="w-8 h-8 bg-purple-50 rounded-lg flex items-center justify-center">
        <svg class="w-4 h-4 text-purple-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      </div>
    </div>
    <p class="text-xl font-black text-slate-800">{{ total_attendance|toman }}</p>
    <p class="text-[10px] text-slate-400 mt-1">جلسه</p>
  </div>
</div>
