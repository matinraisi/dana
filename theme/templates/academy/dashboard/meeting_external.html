{% load static tailwind_tags %}
<!doctype html>
<html lang="fa" dir="rtl" class="h-full scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ school_title }} | جلسه خارجی</title>
  {% tailwind_css %}
  <style>
    @font-face { font-family:"Vazirmatn"; src:url("{% static 'font/fonts/webfonts/Vazirmatn-Regular.woff2' %}") format("woff2"); font-weight:400; }
    @font-face { font-family:"Vazirmatn"; src:url("{% static 'font/fonts/webfonts/Vazirmatn-Black.woff2' %}") format("woff2"); font-weight:900; }
    body { font-family:"Vazirmatn",sans-serif; }
  </style>
</head>
<body class="bg-gradient-to-br from-blue-50 via-white to-indigo-50 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md text-center space-y-6">
    <div class="bg-white rounded-3xl shadow-xl border border-slate-100 p-8">
      <div class="w-16 h-16 mx-auto bg-gradient-to-br from-emerald-400 to-emerald-600 rounded-2xl flex items-center justify-center shadow-lg mb-4">
        <svg class="w-8 h-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/></svg>
      </div>
      <h1 class="text-xl font-black text-slate-800 mb-2">جلسه خارجی</h1>
      <p class="text-sm text-slate-500 mb-6">برای پیوستن به جلسه روی دکمه زیر کلیک کنید</p>
      <a href="{{ meeting_url }}" target="_blank" rel="noopener noreferrer"
         class="inline-flex items-center gap-2 px-8 py-3.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl transition shadow-lg active:scale-[0.99] text-sm">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
        پیوستن به جلسه
      </a>
      <div class="mt-6 p-3 bg-slate-50 rounded-xl text-left" dir="ltr">
        <p class="text-[11px] font-mono text-slate-500 break-all">{{ meeting_url }}</p>
      </div>
      <div class="mt-6">
        <a href="{% url 'academy:meeting_home' %}" class="text-sm text-slate-400 hover:text-slate-600 font-bold transition">
          ← بازگشت
        </a>
      </div>
    </div>
  </div>
</body>
</html>
