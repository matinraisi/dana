{% extends "academy/dashboard/base.html" %}
{% block title %}{% if lead %}ویرایش لید{% else %}لید جدید{% endif %}{% endblock %}

{% block content %}
<div class="flex items-center gap-3 mb-5">
  <a href="{% url 'crm:lead_list' %}" class="text-slate-400 hover:text-slate-700 transition">←</a>
  <h1 class="text-lg font-black text-slate-800">{% if lead %}ویرایش لید{% else %}ثبت لید جدید{% endif %}</h1>
</div>

<div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 max-w-2xl">
  <form method="post">
    {% csrf_token %}
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div>
        <label class="block text-xs font-bold text-slate-600 mb-1">نام *</label>
        <input type="text" name="first_name" value="{{ lead.first_name|default:'' }}"
               class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-indigo-400 transition"
               placeholder="نام" required>
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-600 mb-1">نام خانوادگی *</label>
        <input type="text" name="last_name" value="{{ lead.last_name|default:'' }}"
               class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-indigo-400 transition"
               placeholder="نام خانوادگی" required>
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-600 mb-1">موبایل *</label>
        <input type="text" name="phone_number" value="{{ lead.phone_number|default:'' }}"
               class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm font-mono focus:outline-none focus:border-indigo-400 transition"
               placeholder="09xxxxxxxxx" required>
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-600 mb-1">ایمیل</label>
        <input type="email" name="email" value="{{ lead.email|default:'' }}"
               class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-indigo-400 transition"
               placeholder="example@email.com">
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-600 mb-1">دوره مورد علاقه</label>
        <select name="interested_course"
                class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-indigo-400 transition">
          <option value="">— انتخاب دوره —</option>
          {% for course in courses %}
          <option value="{{ course.id }}"
            {% if lead.interested_course_id == course.id %}selected{% endif %}>
            {{ course.title }}
          </option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-600 mb-1">منبع آشنایی</label>
        <select name="source"
                class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-indigo-400 transition">
          {% for val, label in source_choices %}
          <option value="{{ val }}"
            {% if lead.source == val %}selected{% endif %}>
            {{ label }}
          </option>
          {% endfor %}
        </select>
      </div>
      {% if lead %}
      <div>
        <label class="block text-xs font-bold text-slate-600 mb-1">وضعیت</label>
        <select name="status"
                class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-indigo-400 transition">
          {% for val, label in status_choices %}
          <option value="{{ val }}"
            {% if lead.status == val %}selected{% endif %}>
            {{ label }}
          </option>
          {% endfor %}
        </select>
      </div>
      {% endif %}
      <div class="sm:col-span-2">
        <label class="block text-xs font-bold text-slate-600 mb-1">یادداشت</label>
        <textarea name="note" rows="3"
                  class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-indigo-400 transition resize-none"
                  placeholder="یادداشت‌های مرتبط...">{{ lead.note|default:'' }}</textarea>
      </div>
    </div>
    <div class="flex gap-3 mt-5">
      <button type="submit"
              class="px-6 py-2.5 bg-indigo-600 text-white rounded-xl text-sm font-bold hover:bg-indigo-700 transition">
        {% if lead %}ذخیره تغییرات{% else %}ثبت لید{% endif %}
      </button>
      <a href="{% url 'crm:lead_list' %}"
         class="px-6 py-2.5 bg-slate-100 text-slate-700 rounded-xl text-sm font-bold hover:bg-slate-200 transition">
        انصراف
      </a>
    </div>
  </form>
</div>
{% endblock %}
